<!-- PeakLog app icon — Variation C "Glint" (chosen)
     Background: #0B0B0C  Ink: #F5F5F3
     Progress line with 3 intermediate nodes + peak node (r=7) + sparkle upper-right.
     Edit this file, then run: python3 scripts/generate_icons.py -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#0B0B0C"/>
  <polyline points="24,66 40,55 52,61 74,30" fill="none" stroke="#F5F5F3"
    stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="24" cy="66" r="4.5" fill="#F5F5F3"/>
  <circle cx="40" cy="55" r="4.5" fill="#F5F5F3"/>
  <circle cx="52" cy="61" r="4.5" fill="#F5F5F3"/>
  <circle cx="74" cy="30" r="7" fill="#F5F5F3"/>
  <!-- sparkle: 4-point star glinting off the upper-right of the peak -->
  <path d="M 82 17.4 Q 82.58 20.42 85.6 21 Q 82.58 21.58 82 24.6 Q 81.42 21.58 78.4 21 Q 81.42 20.42 82 17.4 Z"
    fill="#F5F5F3"/>
</svg>
